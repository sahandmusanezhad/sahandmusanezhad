name: Profile assets

# Rebuilds the live parts of the README — the stats card and the contribution
# snake — and publishes them to the `output` branch the README reads from.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00E5FF&color_dots=#161b22,#2e1065,#5b21b6,#a21caf,#ff2e97
            dist/snake-light.svg?color_snake=#7C3AED&color_dots=#ebedf0,#f5d0fe,#e879f9,#c026d3,#86198f

      - name: Stats card
        run: python3 .github/scripts/profile_stats.py --user "${{ github.repository_owner }}" --out dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
